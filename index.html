<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이동 중...</title>
</head>

<body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#555;">

<p id="msg">이동 중입니다...</p>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSc6NHqgbvbXimo0lH1zWQpoz0Krbraq6OoEHqsr8iZiG24AYd-gZthQd7DR3OcqIFzAk1y_Z-wrZTG/pub?gid=0&single=true&output=csv";

function showError(text) {
  document.getElementById('msg').textContent = text;
}

window.onerror = function(message) {
  showError('스크립트 오류: ' + message);
};

function parseCsv(text) {

  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const c = text[i];

    if (inQuotes) {

      if (c === '"') {

        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }

      } else {
        field += c;
      }

    } else {

      if (c === '"') {
        inQuotes = true;

      } else if (c === ',') {
        row.push(field);
        field = '';

      } else if (c === '\n' || c === '\r') {

        if (c === '\r' && text[i + 1] === '\n') {
          i++;
        }

        row.push(field);
        field = '';
        rows.push(row);
        row = [];

      } else {
        field += c;
      }
    }
  }

  if (field.length || row.length) {
    row.push(field);
    rows.push(row);
  }

  return rows;
}

const params = new URLSearchParams(location.search);
const id = params.get('id');

if (!id) {

  showError('잘못된 접근입니다. (id 파라미터 없음)');

} else if (CSV_URL.indexOf('http') !== 0) {

  showError(
    '설정 오류: CSV_URL이 올바르게 입력되지 않았습니다.'
  );

} else {

  fetch(
    CSV_URL +
    (CSV_URL.includes('?') ? '&' : '?') +
    'cb=' + Date.now()
  )

  .then(function(r) {

    if (!r.ok) {
      throw new Error(
        'CSV를 불러오지 못했습니다 (HTTP ' +
        r.status + ').'
      );
    }

    return r.text();
  })

  .then(function(text) {

    const rows = parseCsv(text);
    let dest = '';

    // E열(고유ID)을 검색
    for (let r = 1; r < rows.length; r++) {

      const rowId =
        rows[r][4]
          ? String(rows[r][4]).trim()
          : '';

      if (rowId && rowId === id) {

        // C열(실제 목적지 URL)
        dest =
          rows[r][2]
            ? String(rows[r][2]).trim()
            : '';

        break;
      }
    }

    if (dest) {

      location.replace(dest);

    } else {

      showError(
        '목적지 URL이 아직 설정되지 않았습니다. (id=' +
        id + ')'
      );
    }

  })

  .catch(function(err) {

    showError(
      '연결 중 오류: ' + err.message
    );

  });
}

</script>

</body>
</html>
