<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>이동 중...</title>
</head>

<body
  style="
    font-family:sans-serif;
    text-align:center;
    padding-top:40vh;
    color:#555;
  "
>

<p id="msg">이동 중입니다...</p>

<script src="sheets.js"></script>

<script>

function showError(text) {
  document
    .getElementById("msg")
    .textContent = text;
}


// =====================================================
// CSV 파싱
// =====================================================

function parseCsv(text) {

  const rows = [];

  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const c = text[i];

    if (inQuotes) {

      if (c === '"') {

        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }

      } else {
        field += c;
      }

    } else {

      if (c === '"') {

        inQuotes = true;

      } else if (c === ",") {

        row.push(field);
        field = "";

      } else if (
        c === "\n" ||
        c === "\r"
      ) {

        if (
          c === "\r" &&
          text[i + 1] === "\n"
        ) {
          i++;
        }

        row.push(field);
        field = "";
        rows.push(row);
        row = [];

      } else {
        field += c;
      }
    }
  }

  if (
    field.length ||
    row.length
  ) {
    row.push(field);
    rows.push(row);
  }

  return rows;
}


// =====================================================
// URL 파라미터 읽기
// =====================================================

const params =
  new URLSearchParams(
    location.search
  );

const sheetCode =
  params.get("s");

const id =
  params.get("id");


// =====================================================
// 기본 검사
// =====================================================

if (!sheetCode) {

  showError(
    "잘못된 접근입니다. (s 파라미터 없음)"
  );

} else if (!id) {

  showError(
    "잘못된 접근입니다. (id 파라미터 없음)"
  );

} else if (
  typeof SHEETS === "undefined"
) {

  showError(
    "시트 설정 파일을 불러오지 못했습니다."
  );

} else if (
  !SHEETS[sheetCode]
) {

  showError(
    "등록되지 않은 시트입니다: " +
    sheetCode
  );

} else {

  const csvUrl =
    SHEETS[sheetCode];

  fetch(
    csvUrl +
    (
      csvUrl.includes("?")
        ? "&"
        : "?"
    ) +
    "cb=" +
    Date.now()
  )

  .then(function(response) {

    if (!response.ok) {
      throw new Error(
        "CSV HTTP 오류: " +
        response.status
      );
    }

    return response.text();
  })

  .then(function(text) {

    const rows =
      parseCsv(text);

    let destination = "";

    // E열(고유ID)을 검색
    for (
      let r = 1;
      r < rows.length;
      r++
    ) {

      const rowId =
        rows[r][4]
          ? String(
              rows[r][4]
            ).trim()
          : "";

      if (
        rowId &&
        rowId === id
      ) {

        // C열 실제 목적지 URL
        destination =
          rows[r][2]
            ? String(
                rows[r][2]
              ).trim()
            : "";

        break;
      }
    }

    if (destination) {

      location.replace(
        destination
      );

    } else {

      showError(
        "목적지 URL이 없습니다. (" +
        sheetCode +
        " / ID=" +
        id +
        ")"
      );
    }

  })

  .catch(function(error) {

    showError(
      "연결 오류: " +
      error.message
    );
  });
}

</script>

</body>
</html>
